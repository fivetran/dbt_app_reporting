dbt_versions: '>=1.3.0 <3.0.0'

multi_connector_config:
   itunes_connect:
      database_key: apple_store_database
      union_schema_key: apple_store_union_schemas
      public_models:
         - apple_store__subscription_report
      supported_vars:
        apple_store__subscription_events:
          type: list
          value:
            - "subscribe"
            - "renew"
            - "cancel"
          description: "Subscription events to be tracked and aggregated in `apple_store__subscription_report`, `apple_store__device_report`, and `apple_store__overview_report`."
          display_name: "Apple Store: Subscription Events"
   google_play:
      database_key: google_play_database
      union_schema_key: google_play_union_schemas
      public_models:
         - google_play__finance_report

requires_dbt_seed: true

table_variables:
  apple_store__using_subscriptions:
    - sales_subscription_summary
    - sales_subscription_event_summary
  google_play__using_earnings:
    - earnings
  google_play__using_subscriptions:
    - financial_stats_subscriptions_country

  _fivetran_quickstart_apple_app_crash_daily:
    - app_crash_daily
  _fivetran_quickstart_google_stats_store_performance_traffic_source:
    - stats_store_performance_traffic_source

destination_configurations:
  databricks:
    dispatch:
      - macro_namespace: dbt_utils
        search_order:
          - spark_utils
          - dbt_utils

public_models: [
   "app_reporting__app_version_report",
   "app_reporting__country_report",
   "app_reporting__device_report",
   "app_reporting__os_version_report",
   "app_reporting__overview_report",
   "app_reporting__traffic_source_report"
]
