name: 'app_reporting_integration_tests'
version: '1.3.2'
profile: 'integration_tests'
config-version: 2
vars: 
  # apple_store__using_subscriptions: true # @docs-include
  # google_play__using_subscriptions: true # @docs-include
  # google_play__using_earnings: true # @docs-include
  google_play_schema: app_reporting_integrations_tests
  apple_store_schema: app_reporting_integrations_tests

  google_play:
    google_play_stats_installs_app_version_identifier: "stats_installs_app_version"
    google_play_stats_crashes_app_version_identifier: "stats_crashes_app_version"
    google_play_stats_ratings_app_version_identifier: "stats_ratings_app_version"
    google_play_stats_installs_device_identifier: "stats_installs_device"
    google_play_stats_ratings_device_identifier: "stats_ratings_device"
    google_play_stats_installs_os_version_identifier: "stats_installs_os_version"
    google_play_stats_ratings_os_version_identifier: "stats_ratings_os_version"
    google_play_stats_crashes_os_version_identifier: "stats_crashes_os_version"
    google_play_stats_installs_country_identifier: "stats_installs_country"
    google_play_stats_ratings_country_identifier: "stats_ratings_country"
    google_play_stats_store_performance_country_identifier: "stats_store_performance_country"
    google_play_stats_store_performance_traffic_source_identifier: "stats_store_performance_traffic_source"
    google_play_stats_installs_overview_identifier: "stats_installs_overview"
    google_play_stats_crashes_overview_identifier: "stats_crashes_overview"
    google_play_stats_ratings_overview_identifier: "stats_ratings_overview"
    google_play_earnings_identifier: "earnings"
    google_play_financial_stats_subscriptions_country_identifier: "financial_stats_subscriptions_country"

  apple_store:
    apple_store_app_store_app_identifier: "app_store_app"
    apple_store_sales_subscription_event_summary_identifier: "sales_subscription_event_summary"
    apple_store_sales_subscription_summary_identifier: "sales_subscription_summary"
    apple_store_discovery_and_engagement_standard_daily_identifier: "app_store_discovery_and_engagement_standard_daily"
    apple_store_crash_daily_identifier: "app_crash_daily"
    apple_store_download_standard_daily_identifier: "app_store_download_standard_daily"
    apple_store_session_standard_daily_identifier: "app_session_standard_daily"
    apple_store_installation_and_deletion_standard_daily_identifier: "app_store_installation_and_deletion_standard_daily"

    apple_store__subscription_events:
      - 'Renew'
      - 'Cancel'
      - 'Subscribe'

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['spark_utils', 'dbt_utils']

models:
  +persist_docs:
    relation: true
    columns: "{{ false if target.type in ('databricks') else true }}"
  +schema: "app_reporting_{{ var('directed_schema','dev') }}" ## To be used for validation testing

seeds:
  +docs:
    show: False
  app_reporting_integration_tests:
    +quote_columns: "{{ target.type in ('redshift') or var('fivetran_using_source_casing', false) }}"
    app_crash_daily:
      +column_types:
        app_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        crashes: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        unique_devices: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_synced: "{{ 'timestamptz' if target.type == 'duckdb' else 'timestamp' }}"
    app_session_standard_daily:
      +column_types:
        app_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        sessions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        total_session_duration: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        unique_devices: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_synced: "{{ 'timestamptz' if target.type == 'duckdb' else 'timestamp' }}"
    app_store_app:
      +column_types:
        _fivetran_synced: timestamp
    app_store_discovery_and_engagement_standard_daily:
      +column_types:
        app_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        counts: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        unique_counts: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_synced: "{{ 'timestamptz' if target.type == 'duckdb' else 'timestamp' }}"
    app_store_download_standard_daily:
      +column_types:
        app_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        counts: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_synced: "{{ 'timestamptz' if target.type == 'duckdb' else 'timestamp' }}"
    app_store_installation_and_deletion_standard_daily:
      +column_types:
        app_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        counts: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        unique_devices: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_synced: "{{ 'timestamptz' if target.type == 'duckdb' else 'timestamp' }}"
    earnings:
      +column_types:
        _fivetran_synced: timestamp
    financial_stats_subscriptions_country:
      +column_types:
        _fivetran_synced: timestamp
    sales_subscription_event_summary:
      +column_types:
        vendor_number: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        app_apple_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        subscription_apple_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        subscription_group_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        consecutive_paid_periods: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        previous_subscription_apple_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        days_before_canceling: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        days_canceled: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        quantity: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        paid_service_days_recovered: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_synced: "{{ 'timestamptz' if target.type == 'duckdb' else 'timestamp' }}"
    sales_subscription_summary:
      +column_types:
        vendor_number: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        app_apple_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        subscription_apple_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        subscription_group_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        active_standard_price_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        active_free_trial_introductory_offer_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        active_pay_up_front_introductory_offer_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        active_pay_as_you_go_introductory_offer_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        free_trial_promotional_offer_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        pay_up_front_promotional_offer_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        pay_as_you_go_promotional_offer_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        marketing_opt_ins: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        billing_retry: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        grace_period: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        free_trial_offer_code_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        pay_up_front_offer_code_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        pay_as_you_go_offer_code_subscriptions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        subscribers: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_synced: "{{ 'timestamptz' if target.type == 'duckdb' else 'timestamp' }}"
    stats_crashes_app_version:
      +column_types:
        _fivetran_synced: timestamp
    stats_crashes_os_version:
      +column_types:
        _fivetran_synced: timestamp
    stats_crashes_overview:
      +column_types:
        _fivetran_synced: timestamp
    stats_installs_app_version:
      +column_types:
        _fivetran_synced: timestamp
        active_device_installs: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    stats_installs_country:
      +column_types:
        _fivetran_synced: timestamp
    stats_installs_device:
      +column_types:
        _fivetran_synced: timestamp
    stats_installs_os_version:
      +column_types:
        _fivetran_synced: timestamp
    stats_installs_overview:
      +column_types:
        _fivetran_synced: timestamp
        active_device_installs: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    stats_ratings_app_version:
      +column_types:
        _fivetran_synced: timestamp
        app_version_code: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    stats_ratings_country:
      +column_types:
        _fivetran_synced: timestamp
    stats_ratings_device:
      +column_types:
        _fivetran_synced: timestamp
    stats_ratings_os_version:
      +column_types:
        _fivetran_synced: timestamp
    stats_ratings_overview:
      +column_types:
        _fivetran_synced: timestamp
    stats_store_performance_country:
      +column_types:
        _fivetran_synced: timestamp
    stats_store_performance_traffic_source:
      +column_types:
        _fivetran_synced: timestamp
flags:
  send_anonymous_usage_stats: False
  use_colors: True
